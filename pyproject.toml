[project]
name = "agents-updater"
version = "0.3.0"
description = "CLI tool to update global OpenCode and Codex instructions, agents, and skills"
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
agents-update = "agents_updater:main"

[tool.setuptools]
py-modules = ["agents_updater"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
